<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login TikTok — RR Hair Care</title>
<meta name="robots" content="noindex"/>
<meta name="referrer" content="no-referrer"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon-32x32.png" sizes="32x32"/>
<style>
  :root{--charcoal:#17140F;--accent:#7A2E3F;--muted:#6E6A64;--line:#E6DFD6;--soft-white:#FFFDFA}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--soft-white);color:var(--charcoal);line-height:1.6}
  main{max-width:560px;margin:0 auto;padding:56px 24px}
  h1{font-family:Georgia,serif;font-weight:400;font-size:1.8rem;margin:0 0 12px}
  p{color:#3B3733}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1 id="judul">Login TikTok diterima</h1>
  <p id="isi">Halaman ini dipakai aplikasi internal RR Hair Care untuk menyelesaikan login TikTok
    akun <b>@rrhaircareofficial</b>. Tidak ada yang perlu kamu lakukan di sini.</p>
  <p><a href="/">Kembali ke beranda</a> · <a href="/kebijakan#privasi-tiktok">Kebijakan privasi TikTok</a></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get("error")) {
    document.getElementById("judul").textContent = "Login TikTok dibatalkan";
    document.getElementById("isi").textContent = q.get("error_description") || q.get("error");
  }
</script>
</body>
</html>
