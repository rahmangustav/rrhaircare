# Repo ini sebelumnya tidak punya CI sama sekali — setiap PR mengandalkan
# hasil `npm test` yang dilaporkan manual di deskripsi PR, tanpa verifikasi
# independen dari GitHub. Workflow ini menjalankan suite tests/ (node --test)
# otomatis tiap push/PR ke main supaya status lolos/gagal terlihat langsung
# di halaman PR.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Jalankan test unit
        run: npm test
